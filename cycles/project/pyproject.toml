[project]
name = "cycle-app"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "unishell==2.3.3",
    "unishell-unix==2.2.4",
    "unishell-win==2.3.3",
]

# unishell depends on unishell-unix on Linux/macOS and on unishell-win on
# Windows; both platform packages depend back on unishell unconditionally.
# No [tool.uv] environments filter is set so the cross-platform win32 edge
# stays in uv.lock, exposing how each ruleset handles marker-gated cycles.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
