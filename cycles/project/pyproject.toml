[project]
name = "cycle-app"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "apache-airflow[apache-tinkerpop]==3.4.0",
    "apache-airflow-providers-apache-tinkerpop==1.2.2",
]

# apache-airflow==3.4.0 has an 8-package base cycle (apache-airflow,
# apache-airflow-core, apache-airflow-task-sdk, and 5 default providers).
# The apache-tinkerpop extra adds a 9th cycle member gated on
# `python_version != "3.14"`, while tinkerpop depends back on apache-airflow
# unconditionally and pulls in gremlinpython.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
