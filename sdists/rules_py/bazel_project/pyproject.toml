[project]
name = "sdist-app"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crcmod==1.7",
    "datrie==0.8.3",
    "build",
    "setuptools",
    "wheel",
    "cython",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
