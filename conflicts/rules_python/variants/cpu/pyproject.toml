# Per-variant variant of ../../project/pyproject.toml: the same
# project, but locked for ONE torch build only ("cpu"), so the lock file has no
# [tool.uv] conflicts and no conflict-gated markers.
[project]
name = "torch-app-cpu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "torch>=2.9"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
