[project]
name = "torch-app"
version = "0.1.0"
requires-python = ">=3.12"
# Shared by both variants.
dependencies = ["numpy>=2"]

[project.optional-dependencies]
cpu = ["torch>=2.9"]
cu132 = ["torch>=2.9"]

[tool.uv]
# The two torch builds can't be installed together, so uv resolves them as
# separate forks within one lock file.
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]
# Keep the example small: only lock for Linux x86_64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

# Lock against public PyPI so the lock file is portable.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
